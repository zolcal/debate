name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no tokens, no secrets.
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# One-time setup on PyPI: Account -> Publishing -> "Add a new pending publisher"
# (project: debate, owner: zolcal, repo: debate, workflow: release.yml,
# environment: pypi). The first tagged release creates the project.

on:
  push:
    tags: ["v*"]

jobs:
  # The SAME matrix as ci.yml, deliberately. This gate ran ubuntu-only until
  # v0.4, which meant a tag could publish a package that CI rejected: a Windows
  # regex bug sat red on main for three pushes while a release would have gated
  # green and shipped it. A release gate weaker than the everyday gate is not a
  # gate. If ci.yml's matrix changes, change it here too.
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .  # strict, whole repo — tests included; the public claim is held here
      - run: pytest -q

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing
      # Declaring a permissions block zeroes everything unlisted — without
      # this line, checkout fails on a private repo ("repository not found").
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          python - "$TAG" <<'EOF'
          import re, sys
          tag = sys.argv[1]
          pyproject = open("pyproject.toml", encoding="utf-8").read()
          version = re.search(r'^version = "([^"]+)"', pyproject, re.MULTILINE).group(1)
          sys.path.insert(0, "src")
          import debate
          assert tag == version == debate.__version__, (
              f"tag {tag!r} != pyproject {version!r} != package {debate.__version__!r}"
          )
          EOF
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publishing to PyPI used to be the whole release, which is how the repo's
  # Releases page ended up advertising v0.2.0 as "Latest" while PyPI served
  # 0.3.1: v0.3.1 was tagged and shipped but never given a Release. Creating it
  # from the tag closes that drift for good, and sourcing the body from
  # CHANGELOG.md means the notes are reviewed in-repo like any other published
  # text rather than typed into a web form at the last minute.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the Release object
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          python - "$GITHUB_REF_NAME" <<'EOF' > release-notes.md
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # From this version's heading to the next one. A missing section is a
          # hard failure: a release whose notes nobody wrote is the drift this
          # job exists to prevent.
          match = re.search(r"^## " + re.escape(tag) + r"\b[^\n]*\n(.*?)(?=\n## |\Z)", text, re.S | re.M)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for {tag} - add one before tagging")
          body = match.group(1).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for {tag} is empty")
          sys.stdout.write(body + "\n")
          EOF
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "debate $GITHUB_REF_NAME" --notes-file release-notes.md
