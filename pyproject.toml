[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate"
version = "0.6.0"
description = "Two AI agents review each other's work through two shared text files — enforced turns, a full audit trail, a human always in charge. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zoltan Soos" }]
keywords = ["ai-agents", "multi-agent", "code-review", "governance", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies — stdlib only, deliberately.
dependencies = []

[project.urls]
Homepage = "https://github.com/zolcal/debate"
Issues = "https://github.com/zolcal/debate/issues"
"Case study" = "https://github.com/zolcal/debate/blob/main/docs/case-study.md"

[project.optional-dependencies]
# ruff is PINNED to a minor range on purpose: an unpinned linter makes CI
# non-reproducible, because a new ruff ships new rules and turns unchanged code
# red. That happened on 2026-08-02 — code green on 0.7.x failed on 0.16.1 with
# 17 findings, 8 of them in files untouched for weeks. Bump this deliberately,
# with the rule changes reviewed, rather than inheriting them on a random push.
dev = ["pytest>=8.0.0", "ruff>=0.7,<0.8", "mypy>=1.10.0"]

[project.scripts]
debate = "debate.__main__:main"

[tool.setuptools.package-data]
# `debate setup` scaffolds a channel's PROTOCOL.md from this packaged copy;
# a test pins it byte-equal to the repo-root template so it cannot drift.
debate = ["protocol_template.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
# A NON-editable source install (`pip install /path/to/debate` — how other
# projects on this machine consume debate before a release) makes setuptools
# write build/ into the source tree. mypy then finds two copies of the package
# and refuses with "Duplicate module named 'debate'", so the CI command `mypy .`
# fails on a developer's machine while passing in CI's clean checkout.
# .gitignore already stops build/ being committed and ruff already skips it
# (ruff reads .gitignore; mypy does not), so this is the only durable fix.
# var/ is the broker's runtime tree (exports, per-case build dirs) — gitignored,
# absent in CI's clean checkout, but full of duplicate-module copies locally.
exclude = ["^build/", "^var/"]
